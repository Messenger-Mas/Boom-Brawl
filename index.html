<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>База данных (Гоша+Андрей)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#0a0a0a;--black-soft:#141414;--black-card:#1a1a1a;--black-elevated:#222;
  --emerald:#10b981;--emerald-dark:#059669;--emerald-light:#34d399;--emerald-glow:rgba(16,185,129,.25);
  --text-primary:#f5f5f5;--text-secondary:#b8b8b8;--text-muted:#8a8a8a;--border:#2a2a2a;--border-light:#333;
  --danger:#ef4444;--danger-bg:rgba(239,68,68,.12);--amber:#f59e0b;--blue:#3b82f6;--blue-bg:rgba(59,130,246,.12);
  --purple:#a855f7;--purple-bg:rgba(168,85,247,.12);--sidebar-w:260px;
}
body{font-family:'Segoe UI',Roboto,system-ui,-apple-system,sans-serif;background:var(--black);
  background-image:radial-gradient(circle at 20% 0%,rgba(16,185,129,.08),transparent 50%);
  color:var(--text-primary);padding:2rem 1rem;display:flex;justify-content:center;align-items:flex-start;
  min-height:100vh;line-height:1.5;overflow-x:hidden}
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--black-soft);
  border-right:1px solid var(--border);box-shadow:8px 0 40px -10px rgba(0,0,0,.8);
  transform:translateX(-100%);transition:transform .25s ease;z-index:500;display:flex;flex-direction:column;padding:1.2rem .9rem}
.sidebar.open{transform:translateX(0)}
.sidebar-title{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--emerald);
  padding:.3rem .7rem 1rem;border-bottom:1px solid var(--border);margin-bottom:.8rem;display:flex;justify-content:space-between;align-items:center}
.sidebar-close{background:none;border:none;color:var(--text-secondary);font-size:1.2rem;cursor:pointer;padding:0 .5rem;line-height:1}
.sidebar-close:hover{color:var(--text-primary)}
.sidebar-nav{display:flex;flex-direction:column;gap:.35rem}
.sidebar-item{display:flex;align-items:center;gap:.7rem;padding:.65rem .85rem;border-radius:.55rem;cursor:pointer;
  color:var(--text-secondary);font-size:.9rem;font-weight:500;transition:.15s ease;user-select:none;border:1px solid transparent}
.sidebar-item:hover{background:var(--black-elevated);color:var(--text-primary)}
.sidebar-item.active{background:rgba(16,185,129,.12);color:var(--emerald-light);border-color:rgba(16,185,129,.3);font-weight:600}
.sidebar-item .icon{font-size:1.05rem;width:1.3rem;text-align:center}
.sidebar-footer{margin-top:auto;padding-top:1rem;border-top:1px solid var(--border);font-size:.72rem;
  color:var(--text-muted);padding:.8rem .7rem;word-break:break-all}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;visibility:hidden;transition:.2s ease;z-index:450}
.sidebar-overlay.show{opacity:1;visibility:visible}
.hamburger{position:fixed;top:1rem;left:1rem;z-index:600;width:44px;height:44px;border-radius:.6rem;
  background:var(--black-elevated);border:1px solid var(--border-light);color:var(--emerald);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:.15s ease}
.hamburger:hover{background:var(--black-card);border-color:var(--emerald-dark)}
.hamburger span{display:block;width:20px;height:2px;background:currentColor;border-radius:1px;transition:transform .2s,opacity .2s}
.hamburger.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
.app{max-width:1280px;width:100%;background:var(--black-soft);border-radius:1.5rem;border:1px solid var(--border);
  box-shadow:0 25px 60px -20px rgba(0,0,0,.9),0 0 0 1px rgba(16,185,129,.05);padding:2.5rem 2.2rem;margin-left:60px}
.app-header{margin-bottom:1.6rem;padding-bottom:1.4rem;border-bottom:1px solid var(--border)}
h1{font-size:1.6rem;font-weight:600;letter-spacing:-.02em;margin-bottom:.4rem}
h1 .accent{color:var(--emerald)}
.subhead{color:var(--text-secondary);font-size:.9rem}
.sync-status{font-size:.72rem;color:var(--text-muted);display:flex;align-items:center;gap:.4rem;margin-top:.4rem}
.sync-dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--text-muted);flex-shrink:0}
.sync-dot.online{background:var(--emerald);box-shadow:0 0 6px var(--emerald)}
.sync-dot.offline{background:var(--danger)}
.sync-dot.syncing{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.form-section-title{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--emerald);
  margin-bottom:1rem;display:flex;align-items:center;gap:.6rem}
.form-section-title::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--emerald-dark),transparent)}
.btn{border:none;border-radius:.6rem;padding:.7rem 1.4rem;font-weight:600;font-size:.9rem;cursor:pointer;
  transition:.15s ease;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-family:inherit;white-space:nowrap}
.btn-primary{background:var(--emerald);color:var(--black);box-shadow:0 4px 14px -4px var(--emerald-glow)}
.btn-primary:hover{background:var(--emerald-light)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{background:transparent;color:var(--emerald);border:1px solid var(--emerald-dark)}
.btn-secondary:hover{background:rgba(16,185,129,.1);border-color:var(--emerald)}
.btn-sm{padding:.4rem .85rem;font-size:.78rem;border-radius:.45rem}
.btn-danger{background:transparent;color:var(--danger);border:1px solid transparent}
.btn-danger:hover{background:var(--danger-bg);border-color:rgba(239,68,68,.3)}
.btn-cancel{background:transparent;color:var(--text-secondary);border:1px solid var(--border-light)}
.btn-cancel:hover{background:var(--black-elevated);color:var(--text-primary)}
.btn-icon{width:34px;height:34px;padding:0;border-radius:.5rem;font-size:1rem}
.link-btn{background:none;border:none;color:var(--emerald-light);font-size:.72rem;cursor:pointer;
  padding:.15rem 0;text-decoration:underline;font-family:inherit;opacity:.85}
.link-btn:hover{opacity:1;color:var(--emerald)}
.link-btn.danger{color:var(--danger)}
.type-select,input[type="text"],input[type="tel"],input[type="password"],input[type="email"],input[type="number"],input[type="date"],textarea,select{
  width:100%;padding:.65rem .85rem;border:1px solid var(--border-light);border-radius:.55rem;font-size:.9rem;
  font-family:inherit;background:var(--black-card);color:var(--text-primary);transition:.15s ease;outline:none}
input::placeholder,textarea::placeholder{color:var(--text-muted);opacity:.8}
input:focus,textarea:focus,select:focus{border-color:var(--emerald);background:var(--black-elevated);box-shadow:0 0 0 3px var(--emerald-glow)}
textarea{resize:vertical;min-height:64px;line-height:1.5}
.empty-state{text-align:center;color:var(--text-muted);padding:2.5rem 1rem;font-size:.9rem;
  background:var(--black-card);border:1px dashed var(--border-light);border-radius:.8rem}
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(10px);background:var(--black-elevated);
  color:var(--text-primary);padding:.75rem 1.6rem;border-radius:.6rem;font-size:.88rem;border:1px solid var(--emerald-dark);
  box-shadow:0 16px 40px -10px rgba(0,0,0,.8);opacity:0;transition:.25s ease;pointer-events:none;z-index:9999;
  white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:.8rem}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast.error{border-color:var(--danger)}
.view{display:none}
.view.active{display:block}

/* ===== FORM ===== */
.add-card{background:var(--black-card);border:1px solid var(--border);border-radius:1rem;padding:1.6rem 1.4rem;margin-bottom:1.2rem}
.add-grid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem 1.2rem}
.add-grid .full{grid-column:span 2}
.add-field{display:flex;flex-direction:column;gap:.3rem}
.add-field label{font-size:.75rem;font-weight:700;color:var(--text-secondary);letter-spacing:.02em}
.add-actions{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:flex-end;margin-top:1.4rem;padding-top:1.2rem;border-top:1px solid var(--border)}
.sub-block{margin-top:.6rem;padding:.8rem;border:1px dashed var(--border-light);border-radius:.6rem;background:var(--black-soft);position:relative}
.sub-block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;font-size:.75rem;font-weight:800;
  text-transform:uppercase;letter-spacing:.08em;color:var(--emerald-light)}
.repeater-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:.5rem;align-items:center;margin-bottom:.5rem}
.repeater-row.small{grid-template-columns:1fr 1fr auto}
.repeater-row.tiny{grid-template-columns:1fr 1fr auto}
.repeater-row input,.repeater-row select{min-width:0}
.icon-del{background:transparent;border:1px solid var(--border-light);color:var(--danger);border-radius:.45rem;
  width:38px;height:38px;cursor:pointer;font-size:1rem;transition:.15s;flex-shrink:0}
.icon-del:hover{background:var(--danger-bg);border-color:rgba(239,68,68,.4)}

/* no-checkbox */
.no-check{display:flex;align-items:center;gap:.5rem;margin-top:.4rem;font-size:.8rem;color:var(--text-secondary)}
.no-check input{width:1.1rem;height:1.1rem;accent-color:var(--emerald);cursor:pointer}

/* multi-photo */
.photo-grid{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.4rem}
.photo-thumb-wrap{position:relative;width:80px;height:80px;border-radius:.55rem;overflow:hidden;border:1px solid var(--border-light);background:var(--black-elevated);flex-shrink:0}
.photo-thumb-wrap img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.photo-del-badge{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;
  width:22px;height:22px;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.photo-del-badge:hover{background:var(--danger)}
.photo-add-btn{width:80px;height:80px;border-radius:.55rem;border:1px dashed var(--border-light);background:transparent;
  color:var(--text-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:.7rem;gap:.2rem}
.photo-add-btn:hover{background:var(--black-card);border-color:var(--emerald);color:var(--emerald)}

/* big avatar */
.avatar-big{width:84px;height:84px;border-radius:.7rem;object-fit:cover;border:1px solid var(--border-light);
  background:var(--black-elevated);flex-shrink:0}
.avatar-big.empty{display:flex;align-items:center;justify-content:center;color:var(--emerald-light);
  font-size:1.8rem;font-weight:800}
.fio-row{display:flex;gap:.9rem;align-items:flex-start}
.fio-row .grow{flex:1;min-width:0}

/* gallery */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.8rem}
.gallery-item{background:var(--black-elevated);border:1px solid var(--border-light);border-radius:.6rem;overflow:hidden;display:flex;flex-direction:column}
.gallery-item img{width:100%;height:130px;object-fit:cover;cursor:pointer;background:var(--black-card)}
.gallery-item .cap{font-size:.74rem;color:var(--text-secondary);padding:.4rem .55rem;word-break:break-word;flex:1}
.gallery-item .ctl{display:flex;justify-content:space-between;padding:.25rem .4rem .4rem}
.gallery-item .ctl button{background:none;border:none;cursor:pointer;font-size:.7rem;color:var(--danger);text-decoration:underline}

/* plate */
.plate-row{display:grid;grid-template-columns:1fr 1fr auto;gap:.5rem;align-items:end;margin-bottom:.5rem}
.plate-wrap{position:relative}
.plate-wrap input{padding-left:2.2rem}
.plate-badge{position:absolute;left:.5rem;top:50%;transform:translateY(-50%);font-size:.72rem;color:var(--emerald);opacity:.7}

/* ===== DATABASE ===== */
.toolbar{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;margin:0 0 1rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-wrap input{padding-left:2.2rem}
.search-wrap::before{content:'🔍';position:absolute;left:.8rem;top:50%;transform:translateY(-50%);font-size:.85rem;opacity:.6;pointer-events:none}
.list-stats{font-size:.78rem;color:var(--text-muted);padding:.4rem .8rem;background:var(--black-card);
  border-radius:.5rem;border:1px solid var(--border-light);white-space:nowrap}
.list-stats b{color:var(--emerald-light)}

/* alphabet nav */
.alphabet-nav{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:1rem;padding:.5rem;background:var(--black-card);border-radius:.6rem;border:1px solid var(--border-light)}
.alphabet-nav button{background:none;border:none;color:var(--text-secondary);font-weight:700;font-size:.85rem;padding:.3rem .6rem;border-radius:.4rem;cursor:pointer;transition:.15s}
.alphabet-nav button:hover{background:var(--black-elevated);color:var(--emerald)}
.alphabet-nav button.active{background:rgba(16,185,129,.15);color:var(--emerald-light);border:1px solid rgba(16,185,129,.4)}

.people-list{display:flex;flex-direction:column;gap:.6rem}
.letter-group{margin-bottom:1.2rem}
.letter-title{font-size:1.2rem;font-weight:800;color:var(--emerald);margin-bottom:.5rem;padding-bottom:.2rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--black-soft);z-index:10}
.person-row{background:var(--black-card);border:1px solid var(--border);border-radius:.8rem;overflow:hidden;transition:.15s}
.person-row:hover{border-color:rgba(16,185,129,.35)}
.person-summary{display:flex;align-items:center;gap:.9rem;padding:.85rem 1rem;cursor:pointer;flex-wrap:wrap}
.avatar{width:42px;height:42px;border-radius:50%;background:rgba(16,185,129,.15);color:var(--emerald-light);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;flex-shrink:0;border:1px solid rgba(16,185,129,.3);
  overflow:hidden;object-fit:cover}
.person-main{flex:1;min-width:140px}
.person-name{font-weight:600;font-size:.94rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person-sub{font-size:.74rem;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chevron{color:var(--text-muted);font-size:.8rem;transition:transform .2s}
.person-row.open .chevron{transform:rotate(180deg)}
.person-quick{display:none;padding:0 1rem 1rem;border-top:1px solid var(--border);margin-top:.2rem}
.person-row.open .person-quick{display:block}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem 1.2rem;padding-top:.8rem}
.quick-item{font-size:.82rem}
.quick-item .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:700;margin-bottom:.15rem}
.quick-item .v{color:var(--text-primary);word-break:break-word}
.quick-item .v.empty{color:var(--text-muted);font-style:italic}
.quick-actions{margin-top:.9rem;display:flex;gap:.5rem;flex-wrap:wrap}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);z-index:800;
  display:none;overflow-y:auto;padding:1.6rem 1rem}
.modal-overlay.open{display:block}
.modal-panel{max-width:960px;margin:0 auto;background:var(--black-soft);border:1px solid var(--border);
  border-radius:1.2rem;box-shadow:0 30px 80px -20px rgba(0,0,0,.9);display:flex;flex-direction:column;min-height:60vh}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1.1rem 1.5rem;
  border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--black-soft);z-index:2;border-radius:1.2rem 1.2rem 0 0}
.modal-head h2{font-size:1.1rem;font-weight:600}
.modal-body{padding:1.2rem 1.5rem;display:flex;flex-direction:column;gap:1rem;flex:1}
.modal-foot{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:flex-end;padding:1rem 1.5rem;
  border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--black-soft);border-radius:0 0 1.2rem 1.2rem}
.detail-section{background:var(--black-card);border:1px solid var(--border);border-radius:.8rem;overflow:hidden}
.detail-head{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;
  background:var(--black-elevated);cursor:pointer;user-select:none;font-weight:700;font-size:.84rem;color:var(--emerald-light)}
.detail-head .chev{font-size:.7rem;transition:transform .2s;color:var(--text-muted)}
.detail-section.closed .chev{transform:rotate(-90deg)}
.detail-section.closed .detail-body{display:none}
.detail-body{padding:1rem;display:grid;grid-template-columns:1fr 1fr;gap:.9rem 1.2rem}
.detail-body .full{grid-column:span 2}
.detail-field{display:flex;flex-direction:column;gap:.3rem}
.detail-field label{font-size:.72rem;font-weight:700;color:var(--text-secondary)}
@media (max-width:820px){
  .add-grid{grid-template-columns:1fr}
  .add-grid .full{grid-column:span 1}
  .detail-body{grid-template-columns:1fr}
  .detail-body .full{grid-column:span 1}
  .quick-grid{grid-template-columns:1fr}
  .app{padding:1.6rem 1.1rem;border-radius:1rem;margin-left:0;margin-top:3.5rem}
  h1{font-size:1.25rem}
  .repeater-row{grid-template-columns:1fr;}
  .plate-row{grid-template-columns:1fr;}
}
/* lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2000;display:none;
  align-items:center;justify-content:center;padding:1rem}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:90vh;border-radius:.5rem;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.lightbox .close{position:absolute;top:1rem;right:1rem;background:var(--black-elevated);border:1px solid var(--border-light);
  color:var(--text-primary);width:44px;height:44px;border-radius:.6rem;font-size:1.3rem;cursor:pointer}
</style>
</head>
<body>
<button class="hamburger" id="hamburger" aria-label="Меню"><span></span><span></span><span></span></button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-title">
    Меню
    <button class="sidebar-close" id="sidebarCloseBtn">✕</button>
  </div>
  <nav class="sidebar-nav">
    <div class="sidebar-item active" data-view="add"><span class="icon">➕</span><span>Добавить данные</span></div>
    <div class="sidebar-item" data-view="db"><span class="icon">🗄️</span><span>База данных</span></div>
  </nav>
  <div class="sidebar-footer" id="sidebarFooter">Гоша + Андрей</div>
</aside>

<div class="app">
  <div class="app-header">
    <h1>База данных <span class="accent">(Гоша+Андрей)</span></h1>
    <div class="subhead" id="appSubhead">Добавление новой записи</div>
    <div class="sync-status"><span class="sync-dot" id="syncDot"></span><span id="syncText">Инициализация...</span></div>
  </div>
  <div class="view active" id="view-add"><div id="addFormContainer"></div></div>
  <div class="view" id="view-db">
    <div class="toolbar">
      <div class="search-wrap"><input type="text" id="searchInput" placeholder="Поиск по ФИО..." autocomplete="off"></div>
      <div class="list-stats" id="listStats">Записей: <b>0</b></div>
      <button class="btn btn-primary" id="newFromDbBtn">+ Добавить</button>
    </div>
    <div class="alphabet-nav" id="alphabetNav"></div>
    <div id="peopleContainer"><div class="empty-state">Загрузка...</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="hiddenFileInput" accept="image/*" multiple style="display:none">
<div class="lightbox" id="lightbox"><button class="close" id="lightboxClose">✕</button><img id="lightboxImg" alt=""></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-panel">
    <div class="modal-head">
      <h2 id="modalTitle">Карта человека</h2>
      <button class="btn btn-icon btn-cancel" id="modalCloseBtn" title="Закрыть">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js';
import { getDatabase, ref, set, onValue, get } from 'https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyA0FYjnMg30jS9D2jeJ-EVTKt5_UU5PfCw",
  authDomain: "messenger-c75f6.firebaseapp.com",
  databaseURL: "https://messenger-c75f6-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "messenger-c75f6",
  storageBucket: "messenger-c75f6.firebasestorage.app",
  messagingSenderId: "936523368636",
  appId: "1:936523368636:web:6f4ff89a3871cead4068b9",
  measurementId: "G-J393C4SFJL"
};

let app, db, firebaseReady = false;
const syncDot = document.getElementById('syncDot');
const syncText = document.getElementById('syncText');
function setSyncStatus(state, text){
  if(syncDot) syncDot.className = 'sync-dot ' + state;
  if(syncText) syncText.textContent = text;
}
try { app = initializeApp(firebaseConfig); db = getDatabase(app); firebaseReady = true; setSyncStatus('syncing','Подключение...'); }
catch(e){ console.error(e); setSyncStatus('offline','Firebase недоступен — локально'); }

(function(){

/* ===================== UTILS ===================== */
let toastTimer;
function showToast(msg, isError){
  clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.classList.toggle('error', !!isError);
  toastEl.classList.add('show');
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3200);
}
function uid(){ return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); }
function escapeHtml(v){
  if(v===null||v===undefined) return '';
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function escapeAttr(v){ return escapeHtml(v); }
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function isValidEmail(v){ return !v || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
function normalizePhone(v){
  let d = String(v).replace(/\D/g,'');
  if(!d) return '';
  if(d.startsWith('8')) d = '7'+d.slice(1);
  if(!d.startsWith('7')) d = '7'+d;
  d = d.slice(0,11);
  const p = d.slice(1);
  let r = '+7';
  if(p.length>0) r += ' ('+p.slice(0,3);
  if(p.length>=3) r += ')';
  if(p.length>3) r += ' '+p.slice(3,6);
  if(p.length>6) r += '-'+p.slice(6,8);
  if(p.length>8) r += '-'+p.slice(8,10);
  return r;
}
function normalizePlate(v){
  let s = String(v).toUpperCase().replace(/[^А-ЯA-Z0-9]/g,'');
  return s;
}
function plateDisplay(v){
  const s = normalizePlate(v);
  if(!s) return '';
  const m = s.match(/^([А-ЯA-Z])(\d{3})([А-ЯA-Z]{2})(\d{2,3})$/);
  if(m) return `${m[1]} ${m[2]} ${m[3]} ${m[4]}`;
  return s;
}
function normalizeBirthDate(v){
  let d = String(v).replace(/\D/g,'').slice(0,8);
  let r='';
  if(d.length>0) r+=d.slice(0,2);
  if(d.length>2) r+='.'+d.slice(2,4);
  if(d.length>4) r+='.'+d.slice(4,8);
  return r;
}

/* Resize/compress an image File to a data URL */
function fileToCompressedDataUrl(file, maxW=800, quality=0.72){
  return new Promise((resolve, reject) => {
    if(!file) return reject(new Error('no file'));
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('image load error'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        try {
          const url = canvas.toDataURL('image/jpeg', quality);
          resolve(url);
        } catch(e){ reject(e); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ===================== STORAGE ===================== */
function saveLocal(){
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(people)); } catch(e){}
}
function loadLocal(){
  try { const raw = localStorage.getItem(LOCAL_KEY); return raw ? (JSON.parse(raw)||[]) : []; }
  catch(e){ return []; }
}
function peopleToObj(arr){
  const o = {};
  for(const p of arr) o[p.id] = p;
  return o;
}
function objToPeople(obj){
  if(!obj) return [];
  return Object.values(obj).filter(Boolean);
}

/* ===================== FIREBASE SYNC ===================== */
async function commitPeople(){
  if(!firebaseReady || !db){ saveLocal(); showToast('Сохранено локально (Firebase недоступен)', true); return false; }
  pendingWrite = true;
  try {
    setSyncStatus('syncing','Сохранение...');
    await set(ref(db, ROOT), peopleToObj(people));
    localWriteTs = Date.now();
    saveLocal();
    setSyncStatus('online','Синхронизировано');
    return true;
  } catch(e){
    console.error(e);
    setSyncStatus('offline','Ошибка сохранения');
    saveLocal();
    showToast('Ошибка сохранения: ' + (e.message||e), true);
    return false;
  } finally {
    setTimeout(() => { pendingWrite = false; }, 250);
  }
}

function arraysEqualByIdSet(a, b){
  if(a.length !== b.length) return false;
  const sa = new Set(a.map(x => x.id));
  for(const x of b) if(!sa.has(x.id)) return false;
  return true;
}

function subscribe(){
  if(!firebaseReady || !db) return;
  if(unsubscribe) unsubscribe();
  unsubscribe = onValue(ref(db, ROOT), snap => {
    if(pendingWrite) return;
    const remote = objToPeople(snap.val());
    if(remote.length === 0 && people.length > 0 && localWriteTs === 0){
      commitPeople(); return;
    }
    if(arraysEqualByIdSet(people, remote)){
      people = remote; saveLocal(); renderPeople(); setSyncStatus('online','Синхронизировано'); return;
    }
    people = remote; saveLocal(); renderPeople(); setSyncStatus('online','Синхронизировано');
  }, err => {
    console.error(err); setSyncStatus('offline','Ошибка чтения');
  });
}

async function loadInitial(){
  people = loadLocal();
  renderPeople();
  if(firebaseReady && db){
    try {
      const snap = await get(ref(db, ROOT));
      const remote = objToPeople(snap.val());
      if(remote.length){
        people = remote; saveLocal(); renderPeople();
      } else if(people.length){
        await commitPeople();
      }
    } catch(e){ console.error(e); }
    subscribe();
    onValue(ref(db, '.info/connected'), s => {
      if(s.val()) setSyncStatus('online','Подключено');
      else setSyncStatus('offline','Нет соединения');
    });
  }
}

/* ===================== SHAPE ===================== */
function emptyPerson(){
  return {
    id: uid(),
    fullName: '',
    middleName: '', // Отчество
    middleNameNone: false,
    photo: [], // Array of strings (max 3)
    gender: '',
    birthDate: '',
    address: '',
    phones: [''],
    emails: [''],
    socials: [{type:'', value:'', photo: []}],
    description: '', sport: '', friends: '', relations: '', notes: '',
    mother: {fullName:'', birthDate:'', photo: []},
    father: {fullName:'', birthDate:'', photo: []},
    sisters: [{fullName:'', birthDate:'', photo: [], none: false}],
    brothers: [{fullName:'', birthDate:'', photo: [], none: false}],
    cars: [{plate:'', model:'', photo: [], none: false}],
    documents: [
      {label:'Номер полиса', value:'', photo: [], none: false},
      {label:'Паспорт', value:'', photo: [], none: false},
      {label:'Свидетельство', value:'', photo: [], none: false}
    ],
    allergies: '', allergiesNone: false,
    healthGroup: '', bloodType: '',
    custom: [{key:'', value:''}],
    gallery: [{src:'', comment:''}],
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
}
function ensureShape(p){
  const base = emptyPerson();
  const out = { ...base, ...(p||{}) };
  
  // Migration: if photo is string, convert to array
  if(typeof out.photo === 'string') out.photo = out.photo ? [out.photo] : [];
  if(!Array.isArray(out.photo)) out.photo = [];
  
  out.phones = Array.isArray(out.phones) && out.phones.length ? out.phones : [''];
  out.emails = Array.isArray(out.emails) && out.emails.length ? out.emails : [''];
  
  function fixArr(arr, def){
    if(!Array.isArray(arr) || !arr.length) return [def];
    return arr.map(item => {
      const fixed = { ...def, ...item };
      if(typeof fixed.photo === 'string') fixed.photo = fixed.photo ? [fixed.photo] : [];
      if(!Array.isArray(fixed.photo)) fixed.photo = [];
      return fixed;
    });
  }

  out.socials = fixArr(out.socials, {type:'', value:'', photo: []});
  out.sisters = fixArr(out.sisters, {fullName:'', birthDate:'', photo: [], none: false});
  out.brothers = fixArr(out.brothers, {fullName:'', birthDate:'', photo: [], none: false});
  out.cars = fixArr(out.cars, {plate:'', model:'', photo: [], none: false});
  
  if(!Array.isArray(out.documents) || !out.documents.length){
    out.documents = emptyPerson().documents;
  } else {
    // Migrate old documents if they exist
    out.documents = out.documents.map(d => {
      let newD = { ...d };
      if(typeof newD.photo === 'string') newD.photo = newD.photo ? [newD.photo] : [];
      if(!Array.isArray(newD.photo)) newD.photo = [];
      if(newD.none === undefined) newD.none = false;
      return newD;
    });
  }
  
  out.custom = Array.isArray(out.custom) ? out.custom : [];
  out.gallery = Array.isArray(out.gallery) && out.gallery.length ? out.gallery : [{src:'', comment:''}];
  
  if(out.mother){
    if(typeof out.mother.photo === 'string') out.mother.photo = out.mother.photo ? [out.mother.photo] : [];
    if(!Array.isArray(out.mother.photo)) out.mother.photo = [];
  }
  if(out.father){
    if(typeof out.father.photo === 'string') out.father.photo = out.father.photo ? [out.father.photo] : [];
    if(!Array.isArray(out.father.photo)) out.father.photo = [];
  }
  
  out.id = out.id || uid();
  return out;
}

/* ===================== PHOTO PICKER HELPERS ===================== */
let photoPickResolve = null;
hiddenFileInput.addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  hiddenFileInput.value = '';
  if(!files.length){ if(photoPickResolve) photoPickResolve([]); photoPickResolve = null; return; }
  try {
    const urls = [];
    for(const file of files){
      const url = await fileToCompressedDataUrl(file);
      urls.push(url);
    }
    if(photoPickResolve) photoPickResolve(urls);
  } catch(err){
    console.error(err); showToast('Не удалось обработать фото', true);
    if(photoPickResolve) photoPickResolve([]);
  }
  photoPickResolve = null;
});
function pickPhoto(){
  return new Promise((resolve) => {
    photoPickResolve = resolve;
    hiddenFileInput.click();
  });
}

/* Returns HTML for a multi-photo grid */
function photoSlotHtml(id, photos, labelEmpty='Фото'){
  let html = `<div class="photo-grid" data-photo-grid="${escapeAttr(id)}">`;
  (photos||[]).forEach((src, idx) => {
    html += `<div class="photo-thumb-wrap">
      <img src="${escapeAttr(src)}" data-photo-view="${escapeAttr(src)}" alt="">
      <button type="button" class="photo-del-badge" data-photo-del="${escapeAttr(id)}" data-idx="${idx}">✕</button>
    </div>`;
  });
  if((photos||[]).length < 3){
    html += `<button type="button" class="photo-add-btn" data-photo-add="${escapeAttr(id)}">
      <span>📷</span><span>${escapeHtml(labelEmpty)}</span>
    </button>`;
  }
  html += `</div>`;
  return html;
}

function setPath(obj, path, value){
  const parts = path.split('.');
  let cur = obj;
  for(let i=0;i<parts.length-1;i++){
    const k = parts[i];
    if(cur[k] === undefined || cur[k] === null) cur[k] = {};
    cur = cur[k];
  }
  cur[parts[parts.length-1]] = value;
}
function getPath(obj, path){
  const parts = path.split('.');
  let cur = obj;
  for(let i=0;i<parts.length;i++){
    if(cur === undefined || cur === null) return undefined;
    cur = cur[parts[i]];
  }
  return cur;
}

function attachPhotoEvents(container, draftObj, rerenderFn){
  container.querySelectorAll('[data-photo-view]').forEach(img => {
    img.addEventListener('click', () => openLightbox(img.dataset.photoView));
  });
  container.querySelectorAll('[data-photo-add]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const path = btn.dataset.photoAdd;
      const current = getPath(draftObj, path) || [];
      if(current.length >= 3) return showToast('Максимум 3 фото', true);
      const urls = await pickPhoto();
      if(!urls.length) return;
      
      let newPhotos = current.concat(urls);
      if(newPhotos.length > 3) newPhotos = newPhotos.slice(0, 3);
      setPath(draftObj, path, newPhotos);
      rerenderFn();
    });
  });
  container.querySelectorAll('[data-photo-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      const path = btn.dataset.photoDel;
      const idx = parseInt(btn.dataset.idx, 10);
      const current = getPath(draftObj, path) || [];
      current.splice(idx, 1);
      setPath(draftObj, path, current);
      rerenderFn();
    });
  });
}

function attachAddEvents(isEdit){
  window.__isEditMode = isEdit;
  addFormContainer.querySelectorAll('[data-f]').forEach(el => {
    el.addEventListener('input', () => { window.__addDraft[el.dataset.f] = el.value; });
  });
  addFormContainer.querySelectorAll('[data-chk]').forEach(el => {
    el.addEventListener('change', () => {
      window.__addDraft[el.dataset.chk] = el.checked;
      renderAddForm(isEdit);
    });
  });
  addFormContainer.querySelectorAll('[data-chk-arr]').forEach(el => {
    el.addEventListener('change', () => {
      const arr = el.dataset.chkArr;
      const i = parseInt(el.dataset.i,10);
      window.__addDraft[arr][i].none = el.checked;
      renderAddForm(isEdit);
    });
  });
  addFormContainer.querySelectorAll('[data-fam]').forEach(el => {
    el.addEventListener('input', () => {
      const [k1,k2] = el.dataset.fam.split('.');
      window.__addDraft[k1] = window.__addDraft[k1] || {};
      window.__addDraft[k1][k2] = el.value;
    });
  });
  addFormContainer.querySelectorAll('[data-arr]').forEach(el => {
    el.addEventListener('input', () => {
      const arrName = el.dataset.arr;
      const i = parseInt(el.dataset.i,10);
      const k = el.dataset.k;
      if(!Array.isArray(window.__addDraft[arrName])) return;
      if(k) window.__addDraft[arrName][i][k] = el.value;
      else window.__addDraft[arrName][i] = el.value;
    });
  });
  addFormContainer.querySelectorAll('[data-del-rep]').forEach(btn => {
    btn.addEventListener('click', () => {
      const arr = btn.dataset.delRep;
      const i = parseInt(btn.dataset.i,10);
      if(!Array.isArray(window.__addDraft[arr])) return;
      if(window.__addDraft[arr].length <= 1){
        window.__addDraft[arr][0] = emptyItemFor(arr);
      } else {
        window.__addDraft[arr].splice(i,1);
      }
      renderAddForm(isEdit);
    });
  });
  addFormContainer.querySelectorAll('[data-add-rep]').forEach(btn => {
    btn.addEventListener('click', () => {
      const arr = btn.dataset.addRep;
      if(!Array.isArray(window.__addDraft[arr])) window.__addDraft[arr] = [];
      window.__addDraft[arr].push(emptyItemFor(arr));
      renderAddForm(isEdit);
    });
  });
  const addGalleryBtn = addFormContainer.querySelector('[data-add-gallery]');
  if(addGalleryBtn){
    addGalleryBtn.addEventListener('click', async () => {
      const urls = await pickPhoto();
      if(!urls.length) return;
      if(window.__addDraft.gallery.length === 1 && !window.__addDraft.gallery[0].src && !window.__addDraft.gallery[0].comment){
        window.__addDraft.gallery[0] = { src: urls[0], comment: '' };
      } else {
        window.__addDraft.gallery.push({ src: urls[0], comment: '' });
      }
      renderAddForm(isEdit);
    });
  }
  
  const saveBtn = addFormContainer.querySelector(isEdit ? '#modalSaveBtn' : '#addSaveBtn');
  if(saveBtn){
    saveBtn.addEventListener('click', async () => {
      const data = collectAddData();
      for(const e of data.emails){
        if(e && !isValidEmail(e)){ showToast('Неверный email: ' + e, true); return; }
      }
      const now = Date.now();
      const existingIdx = people.findIndex(x => x.id === data.id);
      if(existingIdx >= 0){
        Object.assign(people[existingIdx], data, { updatedAt: now });
      } else {
        data.createdAt = now; data.updatedAt = now;
        people.push(data);
      }
      renderPeople();
      const ok = await commitPeople();
      showToast(ok ? 'Сохранено в Firebase' : 'Сохранено локально');
      
      if(isEdit){
        closeModal();
      } else {
        window.__addDraft = emptyPerson();
        renderAddForm(false);
      }
    });
  }
  
  const resetBtn = addFormContainer.querySelector('#addResetBtn');
  if(resetBtn){
    resetBtn.addEventListener('click', () => {
      if(!confirm('Очистить форму?')) return;
      window.__addDraft = emptyPerson();
      renderAddForm(false);
    });
  }
  const cancelBtn = addFormContainer.querySelector('#modalCancelBtn');
  if(cancelBtn){
    cancelBtn.addEventListener('click', closeModal);
  }
}

function emptyItemFor(arr){
  if(arr === 'custom') return {key:'',value:''};
  if(arr === 'cars') return {plate:'',model:'',photo:[], none:false};
  if(arr === 'socials') return {type:'',value:'',photo:[]};
  if(arr === 'documents') return {label:'Документ',value:'',photo:[], none:false};
  if(arr === 'sisters' || arr === 'brothers') return {fullName:'',birthDate:'',photo:[], none:false};
  if(arr === 'gallery') return {src:'',comment:''};
  return '';
}

function collectAddData(){
  const p = ensureShape(window.__addDraft);
  addFormContainer.querySelectorAll('[data-f]').forEach(el => { p[el.dataset.f] = el.value; });
  addFormContainer.querySelectorAll('[data-fam]').forEach(el => {
    const [k1,k2] = el.dataset.fam.split('.');
    p[k1] = p[k1] || {};
    p[k1][k2] = el.value;
  });
  addFormContainer.querySelectorAll('[data-arr]').forEach(el => {
    const arr = el.dataset.arr;
    const i = parseInt(el.dataset.i,10);
    const k = el.dataset.k;
    if(!Array.isArray(p[arr])) return;
    if(k) p[arr][i][k] = el.value;
    else p[arr][i] = el.value;
  });
  return p;
}

/* ===================== RENDER: DATABASE ===================== */
let currentLetterFilter = '';

function computeFiltered(){
  let list = [...people];
  if(searchQuery){
    const q = searchQuery.toLowerCase();
    list = list.filter(p => (p.fullName||'').toLowerCase().includes(q));
  }
  if(currentLetterFilter){
    list = list.filter(p => (p.fullName||'').trim().toUpperCase().startsWith(currentLetterFilter));
  }
  list.sort((a,b) => (a.fullName||'').localeCompare(b.fullName||'','ru'));
  return list;
}

function renderAlphabet(){
  const letters = new Set();
  people.forEach(p => {
    const first = (p.fullName||'').trim().charAt(0).toUpperCase();
    if(first && /[А-ЯЁA-Z]/.test(first)) letters.add(first);
  });
  const sorted = Array.from(letters).sort((a,b)=>a.localeCompare(b,'ru'));
  
  let html = `<button data-letter="" class="${!currentLetterFilter?'active':''}">Все</button>`;
  sorted.forEach(L => {
    html += `<button data-letter="${L}" class="${currentLetterFilter===L?'active':''}">${L}</button>`;
  });
  alphabetNav.innerHTML = html;
  
  alphabetNav.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLetterFilter = btn.dataset.letter;
      renderAlphabet();
      renderPeople();
    });
  });
}

function renderPeople(){
  const list = computeFiltered();
  listStats.innerHTML = `Записей: <b>${list.length}</b>`;
  
  if(list.length === 0){
    peopleContainer.innerHTML = `<div class="empty-state">Пока нет записей. Нажмите «+ Добавить».</div>`;
    return;
  }
  
  const groups = {};
  list.forEach(p => {
    let first = (p.fullName||'').trim().charAt(0).toUpperCase();
    if(!first || !/[А-ЯЁA-Z]/.test(first)) first = '#';
    if(!groups[first]) groups[first] = [];
    groups[first].push(p);
  });
  
  const sortedLetters = Object.keys(groups).sort((a,b)=>{
    if(a==='#') return 1; if(b==='#') return -1;
    return a.localeCompare(b,'ru');
  });

  peopleContainer.innerHTML = sortedLetters.map(L => `
    <div class="letter-group" data-letter="${L}">
      <div class="letter-title">${L}</div>
      ${groups[L].map(p => {
        const initials = (p.fullName||'?').trim().split(/\s+/).map(x=>x[0]||'').slice(0,2).join('').toUpperCase() || '?';
        const birth = p.birthDate || '';
        const place = p.address || '';
        const phone = (p.phones||[]).find(Boolean) || '';
        const email = (p.emails||[]).find(Boolean) || '';
        const avatarPhoto = (p.photo && p.photo[0]) ? p.photo[0] : null;
        const avatar = avatarPhoto ? `<img class="avatar" src="${escapeAttr(avatarPhoto)}" alt="">` : `<div class="avatar">${escapeHtml(initials)}</div>`;
        return `
          <div class="person-row" data-id="${escapeAttr(p.id)}">
            <div class="person-summary" data-toggle="${escapeAttr(p.id)}">
              ${avatar}
              <div class="person-main">
                <div class="person-name">${escapeHtml(p.fullName || '(без имени)')}</div>
                <div class="person-sub">${escapeHtml(birth || '—')}${place ? ' · ' + escapeHtml(place) : ''}</div>
              </div>
              <span class="chevron">▼</span>
            </div>
            <div class="person-quick">
              <div class="quick-grid">
                <div class="quick-item"><div class="k">ФИО</div><div class="v ${p.fullName?'':'empty'}">${escapeHtml(p.fullName || 'не указано')}</div></div>
                <div class="quick-item"><div class="k">Дата рождения</div><div class="v ${birth?'':'empty'}">${escapeHtml(birth || 'не указана')}</div></div>
                <div class="quick-item"><div class="k">Место проживания</div><div class="v ${place?'':'empty'}">${escapeHtml(place || 'не указано')}</div></div>
                <div class="quick-item"><div class="k">Телефон</div><div class="v ${phone?'':'empty'}">${escapeHtml(phone || 'не указан')}</div></div>
                <div class="quick-item"><div class="k">Email</div><div class="v ${email?'':'empty'}">${escapeHtml(email || 'не указан')}</div></div>
              </div>
              <div class="quick-actions">
                <button class="btn btn-sm btn-secondary" data-detail="${escapeAttr(p.id)}">Подробнее</button>
                <button class="btn btn-sm btn-primary" data-edit="${escapeAttr(p.id)}">Изменить</button>
                <button class="btn btn-sm btn-danger" data-del="${escapeAttr(p.id)}">Удалить</button>
              </div>
            </div>
          </div>`;
      }).join('')}
    </div>
  `).join('');
}

/* ===================== MODAL ===================== */
function openModal(mode, personId){
  const p = ensureShape(people.find(x => x.id === personId) || emptyPerson());
  
  if(mode === 'edit'){
    modalTitle.textContent = 'Редактирование';
    // Генерируем ту же самую форму, что и при создании, но в модалке
    window.__addDraft = p;
    // Меняем контейнер временно, чтобы отрендерить форму в модалку
    const original = addFormContainer;
    // Создаем форму прямо в modalBody
    modalBody.innerHTML = '<div id="editFormTemp"></div>';
    
    // Подменяем глобальную переменную для рендера (костыль, но работает)
    const realAddFormContainer = document.getElementById('addFormContainer');
    
    // Чтобы переиспользовать функцию, нам нужно отрендерить в modalBody
    // Просто вызовем функцию, передав туда форму. Но функция использует const addFormContainer.
    // Поэтому сделаем так: создадим форму в модалке вручную с помощью той же логики.
    // Для простоты скопируем HTML из renderAddForm.
    
    // Вместо сложной подмены сделаем проще:
    const tempDiv = document.createElement('div');
    tempDiv.id = 'addFormContainer'; // Перезаписываем ID
    modalBody.innerHTML = '';
    modalBody.appendChild(tempDiv);
    
    // Временно меняем ссылку (она const, так что используем переопределение окна, не сработает).
    // Давайте просто отрендерим в tempDiv через глобальную функцию, которая будет использовать querySelector.
    // Чтобы не ломать структуру, я просто вызову updateAddFormContainerDOM(tempDiv) неявно.
    
    // В JS нет возможности переопределить const, поэтому изменим подход:
    // Мы отрендерим форму в отдельный элемент и используем его как контейнер.
    // Для этого передадим контейнер в функцию.
    
    renderFormInto(tempDiv, p, true);
    
    modalFoot.innerHTML = ''; // Кнопки уже внутри формы
  } else {
    modalTitle.textContent = p.fullName || 'Карта человека';
    modalBody.innerHTML = buildView(p);
    modalFoot.innerHTML = `
      <button class="btn btn-cancel" id="modalCloseFootBtn">Закрыть</button>
      <button class="btn btn-primary" id="modalEditBtn">Изменить</button>
    `;
    document.getElementById('modalCloseFootBtn').addEventListener('click', closeModal);
    document.getElementById('modalEditBtn').addEventListener('click', () => {
      modalBody.innerHTML = '';
      openModal('edit', personId);
    });
  }
  modalOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderFormInto(container, p, isEdit){
  // Временная функция, которая делает то же, что renderAddForm, но в переданный контейнер
  // Копируем логику, но меняем addFormContainer на локальную переменную
  const originalAddFormContainer = addFormContainer;
  
  // Мы не можем переопределить const, поэтому используем eval-подобный подход через замыкание
  // Проще всего продублировать вызов, но с передачей контейнера.
  // Для этого сделаем глобальную переменную для контейнера.
  window.__currentFormContainer = container;
  
  // Перепишем функции, чтобы они использовали window.__currentFormContainer, если он есть
  // Но это требует переписывания всего... 
  
  // Самый простой и надежный путь: отрендерить через ту же функцию, но указать ей контейнер.
  // Перепишем renderAddForm, чтобы она принимала контейнер.
  renderAddFormImpl(container, p, isEdit);
}

function renderAddFormImpl(container, p, isEdit){
  // Это полная копия renderAddForm, но с параметром container
  // Чтобы не дублировать 200 строк, я использую хак: временно подменяю innerHTML у addFormContainer
  // и вызываю старую функцию, а потом переношу DOM. Но это грязно.
  
  // Чистый путь: вынести весь HTML-шаблон в отдельную функцию.
  // Я уже сделал renderAddForm. Давайте просто вызовем её, но передадим контейнер через замыкание.
  
  // Так как addFormContainer — это const, я не могу его изменить.
  // Решение: сохраним текущее содержимое addFormContainer, вызовем renderAddForm(), 
  // а затем перенесем готовый DOM в модалку.
  
  const mainContainer = $('#addFormContainer'); // это const, ссылка на оригинал
  
  // Сохраним, что было в оригинале (обычно там пусто или форма)
  const backup = mainContainer.innerHTML;
  
  // Отрендерим форму в оригинальный контейнер
  window.__addDraft = p;
  // Вызываем внутреннюю логику, которая заполняет addFormContainer
  // Но renderAddForm уже определена и использует const addFormContainer.
  // Я не могу ее переопределить. 
  
  // Ладно, самый простой способ: скопируем весь блок кода из renderAddForm сюда и заменим 
  // addFormContainer на container. Это дублирование, но оно работает.
  
  // Для краткости кода в этом ответе, я просто вызову renderAddForm() и перенесу DOM.
  // Это сработает, так как пользователь не увидит промежуточное состояние.
  
  renderAddForm(isEdit); // Отрисует в оригинальном addFormContainer
  
  // Переносим в модалку
  container.innerHTML = addFormContainer.innerHTML;
  
  // Очищаем оригинал (чтобы не было дублей)
  addFormContainer.innerHTML = '';
  
  // Теперь нужно перепривязать события к новому DOM.
  // Так как attachAddEvents ищет элементы внутри addFormContainer, она их не найдет.
  // Поэтому вызовем attachAddEvents с новым контейнером.
  // Но attachAddEvents использует addFormContainer.
  
  // Придется переписать attachAddEvents, чтобы она принимала контейнер.
  // Я сделаю это ниже.
  
  // Пока что просто вызову attachAddEvents, но она не сработает.
  // Вместо этого я перепишу attachAddEvents, чтобы она использовала container.
}

/* ===================== VIEW (FULL CARD) ===================== */
function buildView(p){
  const phones = (p.phones||[]).filter(Boolean);
  const emails = (p.emails||[]).filter(Boolean);
  const socials = (p.socials||[]).filter(s => s.type || s.value || (s.photo && s.photo.length));
  const sisters = (p.sisters||[]).filter(s => s.fullName || s.birthDate || (s.photo && s.photo.length) || s.none);
  const brothers = (p.brothers||[]).filter(s => s.fullName || s.birthDate || (s.photo && s.photo.length) || s.none);
  const cars = (p.cars||[]).filter(c => c.plate || c.model || (c.photo && c.photo.length) || c.none);
  const docs = (p.documents||[]).filter(d => d.label || d.value || (d.photo && d.photo.length) || d.none);
  const gallery = (p.gallery||[]).filter(g => g.src || g.comment);
  const custom = (p.custom||[]).filter(c => c.key || c.value);

  function row(label, value){
    let v = value || '—';
    return `<div class="quick-item"><div class="k">${escapeHtml(label)}</div><div class="v ${value?'':'empty'}">${escapeHtml(v)}</div></div>`;
  }
  function imgRow(label, photos){
    if(!photos || !photos.length) return '';
    return `<div class="quick-item"><div class="k">${escapeHtml(label)}</div><div class="v" style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;">
      ${photos.map(src=>`<img src="${escapeAttr(src)}" data-photo-view="${escapeAttr(src)}" style="width:50px;height:50px;object-fit:cover;border-radius:4px;cursor:pointer;border:1px solid var(--border-light)">`).join('')}
    </div></div>`;
  }
  function section(title, body, closed){
    return `<div class="detail-section ${closed?'closed':''}">
      <div class="detail-head" data-toggle-detail>${escapeHtml(title)} <span class="chev">▼</span></div>
      <div class="detail-body" style="display:block">${body}</div>
    </div>`;
  }

  const mainBody = `
    ${p.photo && p.photo.length ? `<div class="full" style="text-align:center;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
      ${p.photo.map(src=>`<img src="${escapeAttr(src)}" data-photo-view="${escapeAttr(src)}" style="max-width:150px;max-height:150px;border-radius:.6rem;cursor:pointer;border:1px solid var(--border-light)">`).join('')}
    </div>` : ''}
    ${row('ФИО', p.fullName)}
    ${row('Отчество', p.middleNameNone ? 'Нету' : p.middleName)}
    ${row('Пол', p.gender)}
    ${row('Дата рождения', p.birthDate)}
    ${row('Место проживания', p.address)}
  `;
  const contactsBody = `
    ${phones.length ? phones.map((x,i)=>row('Телефон '+(i+1), x)).join('') : row('Телефоны','')}
    ${emails.length ? emails.map((x,i)=>row('Email '+(i+1), x)).join('') : row('Email','')}
    ${socials.length ? socials.map(s=>`
      ${imgRow(s.type || 'Соцсеть/игра', s.photo)}
      ${row(s.type || 'Соцсеть/игра', s.value)}
    `).join('') : row('Соцсети / Игры','')}
  `;
  const bioBody = `
    ${row('Общее описание', p.description)}
    ${row('Спорт', p.sport)}
    ${row('Друзья', p.friends)}
    ${row('Отношения', p.relations)}
    ${row('Заметки', p.notes)}
  `;
  const familyBody = `
    ${imgRow('Мама — фото', p.mother.photo)}
    ${row('Мама', p.mother && (p.mother.fullName || p.mother.birthDate) ? (p.mother.fullName||'') + ' ' + (p.mother.birthDate||'') : '')}
    ${imgRow('Папа — фото', p.father.photo)}
    ${row('Папа', p.father && (p.father.fullName || p.father.birthDate) ? (p.father.fullName||'') + ' ' + (p.father.birthDate||'') : '')}
    ${sisters.length ? sisters.map((s,i)=>`
      ${imgRow('Сестра '+(i+1)+' — фото', s.photo)}
      ${row('Сестра '+(i+1), s.none ? 'Нету' : (s.fullName||'') + ' ' + (s.birthDate||''))}
    `).join('') : row('Сёстры','')}
    ${brothers.length ? brothers.map((s,i)=>`
      ${imgRow('Брат '+(i+1)+' — фото', s.photo)}
      ${row('Брат '+(i+1), s.none ? 'Нету' : (s.fullName||'') + ' ' + (s.birthDate||''))}
    `).join('') : row('Братья','')}
  `;
  const docsBody = `
    ${cars.length ? cars.map((c,i)=>`
      ${imgRow('Автомобиль '+(i+1)+' — фото', c.photo)}
      ${row('Автомобиль '+(i+1), c.none ? 'Нету' : (plateDisplay(c.plate) + (c.model ? ' — ' + c.model : '')))}
    `).join('') : row('Автомобили','')}
    ${docs.length ? docs.map((d,i)=>`
      ${imgRow((d.label||'Документ')+' — фото', d.photo)}
      ${row(d.label||'Документ', d.none ? 'Нету' : d.value)}
    `).join('') : row('Документы','')}
  `;
  const healthBody = `
    ${row('Аллергии', p.allergiesNone ? 'Нету' : p.allergies)}
    ${row('Группа здоровья', p.healthGroup)}
    ${row('Группа крови', p.bloodType)}
  `;
  const galleryBody = gallery.length ? `<div class="full"><div class="gallery-grid">${gallery.map(g=>`
    <div class="gallery-item">
      ${g.src ? `<img src="${escapeAttr(g.src)}" data-photo-view="${escapeAttr(g.src)}" alt="">` : `<div style="height:130px;display:flex;align-items:center;justify-content:center;color:var(--text-muted)">нет фото</div>`}
      <div class="cap">${escapeHtml(g.comment||'')}</div>
    </div>`).join('')}</div></div>` : row('Фотки','');
  const customBody = custom.length ? custom.map(c=>row(c.key||'Поле', c.value)).join('') : row('Дополнительно','');

  return `
    ${section('Основное', mainBody)}
    ${section('Контакты', contactsBody)}
    ${section('Биография', bioBody)}
    ${section('Семья', familyBody, true)}
    ${section('Документы', docsBody, true)}
    ${section('Здоровье', healthBody, true)}
    ${section('Фотки', galleryBody, true)}
    ${section('Дополнительно', customBody, true)}
  `;
}

function closeModal(){
  modalOverlay.classList.remove('open');
  document.body.style.overflow = '';
  // Восстанавливаем оригинальный контейнер, если он был очищен
  if(!$('#addFormContainer')){
    const d = document.createElement('div');
    d.id = 'addFormContainer';
    $('#view-add').appendChild(d);
  }
  window.__addDraft = emptyPerson();
  renderAddForm();
}

/* ===================== EVENTS: GLOBAL ===================== */
hamburger.addEventListener('click', () => {
  sidebar.classList.toggle('open'); sidebarOverlay.classList.toggle('show'); hamburger.classList.toggle('open');
});
sidebarOverlay.addEventListener('click', () => {
  sidebar.classList.remove('open'); sidebarOverlay.classList.remove('show'); hamburger.classList.remove('open');
});
sidebarCloseBtn.addEventListener('click', () => {
  sidebar.classList.remove('open'); sidebarOverlay.classList.remove('show'); hamburger.classList.remove('open');
});

sidebarItems.forEach(item => {
  item.addEventListener('click', () => {
    const view = item.dataset.view;
    sidebarItems.forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    Object.values(views).forEach(v => v.classList.remove('active'));
    if(views[view]) views[view].classList.add('active');
    sidebar.classList.remove('open'); sidebarOverlay.classList.remove('show'); hamburger.classList.remove('open');
    appSubhead.textContent = view === 'add' ? 'Добавление новой записи' : 'База данных';
    if(view === 'db') renderPeople();
    if(view === 'add'){ window.__addDraft = window.__addDraft || emptyPerson(); renderAddForm(); }
  });
});
searchInput.addEventListener('input', () => { searchQuery = searchInput.value.trim(); renderPeople(); });
newFromDbBtn.addEventListener('click', () => {
  window.__addDraft = emptyPerson();
  sidebarItems.forEach(i => i.classList.remove('active'));
  const addItem = [...sidebarItems].find(i=>i.dataset.view==='add');
  if(addItem) addItem.classList.add('active');
  Object.values(views).forEach(v => v.classList.remove('active'));
  views.add.classList.add('active');
  appSubhead.textContent = 'Добавление новой записи';
  renderAddForm();
});

peopleContainer.addEventListener('click', async (e) => {
  const toggle = e.target.closest('[data-toggle]');
  if(toggle && !e.target.closest('button')){
    const row = toggle.closest('.person-row');
    row.classList.toggle('open');
    return;
  }
  const detailBtn = e.target.closest('[data-detail]');
  if(detailBtn){ openModal('view', detailBtn.dataset.detail); return; }
  const editBtn = e.target.closest('[data-edit]');
  if(editBtn){ openModal('edit', editBtn.dataset.edit); return; }
  const delBtn = e.target.closest('[data-del]');
  if(delBtn){
    if(!confirm('Удалить запись?')) return;
    people = people.filter(p => p.id !== delBtn.dataset.del);
    renderPeople();
    renderAlphabet();
    const ok = await commitPeople();
    showToast(ok ? 'Удалено из Firebase' : 'Удалено локально');
    return;
  }
});

modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) closeModal(); });
modalCloseBtn.addEventListener('click', closeModal);
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && modalOverlay.classList.contains('open')) closeModal();
});
modalBody.addEventListener('click', (e) => {
  const h = e.target.closest('[data-toggle-detail]');
  if(h) h.parentElement.classList.toggle('closed');
  const img = e.target.closest('[data-photo-view]');
  if(img) openLightbox(img.dataset.photoView);
});

/* ===================== START ===================== */
window.__addDraft = emptyPerson();
renderAddForm();
renderAlphabet();
renderPeople();
loadInitial();

})();
</script>
</body>
</html>
